<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

    <h1>Registrasi Mahasiwa</h1>
    <p>Data Mahasiswa</p>

    <!-- BUTTON TAMBAH -->
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalForm" onclick="tambahData()">
        Tambah
    </button>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>NPM</th>
                <th>Nama</th>
                <th>Tanggal Lahir</th>
                <th>Program Studi</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td>0001</td>
                <td>Nama Mahasiswa 1</td>
                <td>1989-09-01</td>
                <td>Informatika</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editData(this)">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="hapusData(this)">Hapus</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- MODAL FORM -->
    <div class="modal fade" id="modalForm">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Form Mahasiswa</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="rowIndex">

                    <div class="mb-2">
                        <label>NPM</label>
                        <input type="text" id="npm" class="form-control">
                    </div>

                    <div class="mb-2">
                        <label>Nama</label>
                        <input type="text" id="nama" class="form-control">
                    </div>

                    <div class="mb-2">
                        <label>Tanggal Lahir</label>
                        <input type="date" id="tgl" class="form-control">
                    </div>

                    <div class="mb-2">
                        <label>Prodi</label>
                        <select id="prodi" class="form-select">
                            <option value="">Pilih</option>
                            <option>Informatika</option>
                            <option>Sistem Informasi</option>
                            <option>Teknik Informatika</option>
                            <option>Bisnis Digital</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="simpanData()">Submit</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL HAPUS -->
    <div class="modal fade" id="modalHapus">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5>Konfirmasi</h5>
                </div>
                <div class="modal-body">
                    Yakin mau hapus data?
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger" onclick="confirmHapus()">Hapus</button>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let selectedRow = null;

        // TAMBAH
        function tambahData() {
            selectedRow = null;
            document.getElementById("npm").value = "";
            document.getElementById("nama").value = "";
            document.getElementById("tgl").value = "";
            document.getElementById("prodi").value = "";
        }

        // EDIT
        function editData(btn) {
            selectedRow = btn.parentElement.parentElement;

            document.getElementById("npm").value = selectedRow.cells[0].innerText;
            document.getElementById("nama").value = selectedRow.cells[1].innerText;
            document.getElementById("tgl").value = selectedRow.cells[2].innerText;
            document.getElementById("prodi").value = selectedRow.cells[3].innerText;

            new bootstrap.Modal(document.getElementById('modalForm')).show();
        }

        // SIMPAN
        function simpanData() {
            let npm = document.getElementById("npm").value;
            let nama = document.getElementById("nama").value;
            let tgl = document.getElementById("tgl").value;
            let prodi = document.getElementById("prodi").value;

            if (selectedRow == null) {
                // tambah baru
                let row = `
        <tr>
            <td>${npm}</td>
            <td>${nama}</td>
            <td>${tgl}</td>
            <td>${prodi}</td>
            <td>
                <button class="btn btn-warning btn-sm" onclick="editData(this)">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="hapusData(this)">Hapus</button>
            </td>
        </tr>`;
                document.getElementById("tableBody").innerHTML += row;
            } else {
                // update
                selectedRow.cells[0].innerText = npm;
                selectedRow.cells[1].innerText = nama;
                selectedRow.cells[2].innerText = tgl;
                selectedRow.cells[3].innerText = prodi;
            }

            bootstrap.Modal.getInstance(document.getElementById('modalForm')).hide();
        }

        // HAPUS
        function hapusData(btn) {
            selectedRow = btn.parentElement.parentElement;
            new bootstrap.Modal(document.getElementById('modalHapus')).show();
        }

        function confirmHapus() {
            selectedRow.remove();
            bootstrap.Modal.getInstance(document.getElementById('modalHapus')).hide();
        }
    </script>

</body>

</html>
